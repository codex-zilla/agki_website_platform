<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Sent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Password Reset Sent</h3>
                    </div>
                    <div class="card-body text-center">
                        <div class="alert alert-success" role="alert">
                            <i class="fas fa-envelope fa-2x mb-3"></i>
                            <h4>Check your email!</h4>
                            <p>We've sent you a password reset link. Please check your email and click the link to reset your password.</p>
                        </div>
                        
                        <p class="text-muted">
                            If you don't receive an email within a few minutes, please check your spam folder.
                        </p>
                        
                        <a href="{% url 'signin' %}" class="btn btn-primary">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
