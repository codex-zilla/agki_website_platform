{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T256LX3B9J"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T256LX3B9J');

    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="{% static 'app/logo.png' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | AGKI Medical Laboratory</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2d5a2d;
            --light-green: #4a7c59;
            --gradient-green: linear-gradient(135deg, #2d5a2d 0%, #4a7c59 100%);
            --accent-green: #7cc576;
            --light-bg: #f8f9fa;
            --dark-text: #333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--dark-text);
            background-color: #f5f5f5;
        }
        .success-message-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
            padding: 20px;
        }

        .success-message-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="success-message-container">
    <div class="success-message-content">
        <i class="fas fa-check-circle text-success mb-3" style="font-size: 3rem;"></i>
        <h3>Appointment Booked Successfully!</h3>
        <p>We will contact you shortly to confirm your appointment.</p>
        <a href="{% url 'book_appointment' %}" class="btn btn-success mt-3">
            <i class="fas fa-calendar-plus me-2"></i> Book Another Appointment
        </a>
        <a href="{% url 'home' %}" class="btn btn-outline-success mt-3 ms-2">
            <i class="fas fa-home me-2"></i> Return Home
        </a>
    </div>
</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

</body>
